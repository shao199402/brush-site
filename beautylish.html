<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beautylish 商品 | 笔刷商品目录</title>
  <meta name="description" content="Beautylish 零售商全站商品静态目录（含品牌筛选）" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css?v=20261014" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="返回首页">
      <span class="brand-mark">Beautylish 商品</span>
      <span class="brand-sub">Beautylish Catalog</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="./index.html">首页</a>
      <a href="#catalog">全部商品</a>
    </nav>
  </header>

  <main id="top">
    <section class="catalog-hero">
      <div>
        <span class="section-kicker">BEAUTYLISH · US RETAILER</span>
        <h1>Beautylish 商品</h1>
        <p class="lead">美国美妆零售商 Beautylish 的全站商品目录，涵盖 100+ 个品牌。可按商品名、品牌、品类、材质搜索，也可按<b>品类</b>或<b>品牌</b>筛选。价格为该站按访问地区显示的原价（人民币）。</p>
      </div>
      <a class="btn ghost" href="./index.html">返回首页</a>
    </section>

    <section class="catalog-section catalog-page" id="catalog">
      <div class="catalog-tools" aria-label="商品筛选工具">
        <input id="catalogSearch" type="search" placeholder="搜索商品、品牌、品类…" aria-label="搜索商品" />
        <select id="catalogType" aria-label="按商品品类筛选"></select>
        <span id="catalogBrandWrap" hidden>
          <select id="catalogBrand" aria-label="按品牌筛选"></select>
        </span>
        <span id="catalogCount" class="catalog-count">正在载入商品…</span>
      </div>
      <div id="catalogGrid" class="catalog-grid"></div>
      <button id="loadMore" class="btn ghost load-more" type="button">加载更多</button>
    </section>

    <div class="product-modal" id="productModal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="商品详情">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭商品详情">×</button>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <strong>Beautylish 商品目录</strong>
      <p>纯前端静态展示页面 · 品牌筛选 · 商品详情弹窗</p>
    </div>
    <p class="credit">商品文字、图片与价格来自 Beautylish 公开商品页面，仅用于页面参考展示。Beautylish 为第三方零售商，非品牌官网。</p>
  </footer>
  <script src="./beautylish-data.js?v=20261014"></script>
  <script src="./catalog.js?v=20261014"></script>
</body>
</html>
