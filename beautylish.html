<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Beautylish 商品 | 笔刷商品目录</title>
  <meta name="description" content="Beautylish 全站商品静态目录展示页面" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./style.css?v=20261042" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./index.html" aria-label="返回首页">
      <span class="brand-mark">Beautylish 商品</span>
      <span class="brand-sub">BEAUTYLISH Catalog</span>
    </a>
    <nav class="nav" aria-label="主导航">
      <a href="./index.html">首页</a>
      <a href="#catalog">全部商品</a>
    </nav>
  </header>

  <main id="top">
    <section class="catalog-hero">
      <div>
        <span class="section-kicker">BEAUTYLISH · US RETAILER</span>
        <h1>Beautylish 商品</h1>
        <p class="lead">美国美妆零售商 Beautylish 全站目录。商品名为英文原名（正品名），描述与规格为中文。可搜索、可按品类与品牌筛选。</p>
      </div>
      <a class="btn ghost" href="./index.html">返回首页</a>
    </section>

    <section class="catalog-section catalog-page" id="catalog">
        <div class="catalog-tools" aria-label="商品筛选工具">
          <label class="catalog-field catalog-field--search">
            <span class="catalog-field__label">搜索</span>
            <input id="catalogSearch" type="search" placeholder="搜索商品、品牌、品类…" aria-label="搜索商品" />
          </label>
          <label class="catalog-field">
            <span class="catalog-field__label">一级品类</span>
            <select id="catalogType" aria-label="按品类筛选"></select>
          </label>
          <!-- 品牌：catalog.js 只在数据带 brand 字段时才显示 -->
          <label class="catalog-field" id="catalogBrandWrap" hidden>
            <span class="catalog-field__label">品牌</span>
            <select id="catalogBrand" aria-label="按品牌筛选"></select>
          </label>
          <label class="catalog-field" id="catalogDimWrap" hidden>
            <span class="catalog-field__label">二级分类</span>
            <select id="catalogDim" aria-label="按分类维度筛选"></select>
          </label>
          <span id="catalogCount" class="catalog-count">正在载入商品…</span>
        </div>
      <div id="catalogGrid" class="catalog-grid"></div>
      <button id="loadMore" class="btn ghost load-more" type="button">加载更多</button>
    </section>

    <div class="product-modal" id="productModal" hidden>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-label="商品详情">
        <button class="modal-close" id="modalClose" type="button" aria-label="关闭商品详情">×</button>
        <div id="modalBody" class="modal-body"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div>
      <strong>Beautylish 商品目录</strong>
      <p>纯前端静态展示页面 · 商品列表 · 商品详情弹窗</p>
    </div>
    <p class="credit">商品文字、图片与价格来自公开商品页面，仅用于页面参考展示。商品名保留英文原名。</p>
  </footer>
  <script src="./beautylish-data.js?v=20261042"></script>
  <script src="./catalog.js?v=20261042"></script>
</body>
</html>
